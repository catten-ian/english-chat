[package]
name = "ai-english-chat-dev"
version = "0.1.0"
description = "AI English Chat development desktop wrapper"
authors = ["Catten"]
edition = "2021"

[lib]
name = "ai_english_chat_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
